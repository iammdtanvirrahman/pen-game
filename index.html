<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pen Game</title>
<style>
:root{--bg:#080808;--sf:#111114;--ac:#dc3545;--tx:#f5f5f7;--mu:#a1a1aa;--bd:#2a2a30;color-scheme:dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none;overscroll-behavior:none}
body{display:flex;flex-direction:column}
#stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
#c{touch-action:none;display:block;border-radius:12px}
#top{display:none;align-items:center;gap:8px;padding:8px 12px;flex-wrap:wrap}
#turn{font-weight:600;display:flex;align-items:center;gap:8px}#turn small{color:var(--mu);font-weight:400}
#turn i{animation:pop .4s}@keyframes pop{from{transform:scale(2.2)}}
i{display:inline-block;width:12px;height:12px;border-radius:50%;flex:none}
#order{display:flex;gap:6px;flex:1;flex-wrap:wrap;font-size:13px;color:var(--mu)}
#order span{display:flex;align-items:center;gap:5px;padding:2px 8px;border:1px solid var(--bd);border-radius:99px}
#order .on{border-color:var(--ac);color:var(--tx)}#order .x{opacity:.35;text-decoration:line-through}
#pwr{width:80px;height:8px;background:#222;border-radius:4px;overflow:hidden}#pwf{height:100%;width:0;background:var(--ac)}
button,select,input{font:inherit;color:var(--tx);background:#1b1b20;border:1px solid var(--bd);border-radius:10px;padding:9px 14px}
button{cursor:pointer}button.pr{background:var(--ac);border-color:var(--ac)}button:hover{filter:brightness(1.15)}
:focus-visible{outline:2px solid var(--tx);outline-offset:2px}
input[type=text]{user-select:text;-webkit-user-select:text;min-width:0;flex:1}
#scr{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(8,8,8,.85);padding:16px;overflow:auto;z-index:5}
.p{background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:22px;max-width:520px;width:100%;max-height:100%;overflow:auto}
.p h2,.p h3{margin:.2em 0 .5em}.p h3{font-size:13px;color:var(--mu);text-transform:uppercase;letter-spacing:.08em;margin-top:1.2em}
.p label{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:10px 0}
.g{display:grid;gap:10px;margin-top:14px}.row{display:flex;gap:8px;align-items:center;margin:8px 0}
.logo{text-align:center}.logo b{display:block;font-size:42px;letter-spacing:.02em}.logo span{color:var(--ac)}
.pg{height:14px;width:150px;margin:14px auto 4px;border-radius:7px;background:linear-gradient(90deg,#1e1e22 12%,#dc3545 12% 18%,#2563eb 18% 88%,#111 88%);animation:sw 3.5s ease-in-out infinite alternate}
@keyframes sw{from{transform:translateX(-30px) rotate(-4deg)}to{transform:translateX(30px) rotate(4deg)}}
.st{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}.st div{background:#18181c;border-radius:10px;padding:8px}.st b{display:block;font-size:18px}.st span{font-size:12px;color:var(--mu)}
.mu{color:var(--mu);font-size:14px}ol{padding-left:20px}
#toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:var(--sf);border:1px solid var(--ac);padding:8px 16px;border-radius:99px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:6}
#toast.on{opacity:1}
.rm *{animation:none!important;transition:none!important}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
/* interface v2 */
#top{background:linear-gradient(180deg,rgba(20,20,24,.96),rgba(17,17,20,.6));backdrop-filter:blur(8px);border-bottom:1px solid var(--bd);padding:8px 14px;gap:10px}
#turn{background:#18181c;border:1px solid var(--bd);border-radius:99px;padding:6px 14px 6px 10px}
#turn i{width:14px;height:14px;box-shadow:0 0 10px currentColor}
#order{gap:10px}#order span{padding:0;border:0;gap:6px;font-size:12px}#order em{font-style:normal}
#order b{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:13px;color:#fff;background:var(--c);border:2px solid transparent;box-shadow:0 2px 8px rgba(0,0,0,.5);transition:transform .2s}
#order .on{border:0}#order .on b{border-color:#fff;transform:scale(1.15);box-shadow:0 0 0 3px rgba(255,255,255,.15),0 0 14px var(--c)}#order .on em{color:#fff}#order .x b{background:#26262b;color:var(--mu)}
#top button{width:38px;height:38px;padding:0;border-radius:50%;display:grid;place-items:center;font-size:16px}
#pwr{width:110px;height:10px;border-radius:5px;background:#1b1b20;border:1px solid var(--bd)}#pwf{background:linear-gradient(90deg,#22c55e,#eab308,#dc3545) left/110px 100%}
#scr{backdrop-filter:blur(6px);background:radial-gradient(ellipse at 50% 0,rgba(220,53,69,.14),rgba(8,8,8,.92) 62%)}
.p{background:linear-gradient(180deg,#17171b,#101013);border:1px solid #2b2b31;box-shadow:0 20px 60px rgba(0,0,0,.6),0 0 0 1px rgba(220,53,69,.08);animation:rise .35s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.98)}}
button{transition:transform .12s,filter .12s}button:active{transform:scale(.97)}
button.pr{background:linear-gradient(180deg,#e8485a,#c52b3c);box-shadow:0 6px 18px rgba(220,53,69,.35);font-weight:600}
.logo b{font-size:clamp(40px,9vw,58px);font-weight:800;letter-spacing:-.02em;line-height:1.1;background:linear-gradient(180deg,#fff,#b9b9c2);-webkit-background-clip:text;background-clip:text;color:transparent}
.logo b span{background:linear-gradient(180deg,#ff6577,#dc3545);-webkit-background-clip:text;background-clip:text;color:transparent}
.logo .bn{font-size:18px}.logo p{margin:2px 0 0}
.pg{width:190px;height:16px;border-radius:8px;filter:drop-shadow(0 10px 8px rgba(0,0,0,.6))}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.st div{border:1px solid var(--bd);border-radius:12px;padding:10px 6px}.st span.ic{font-size:18px;display:block;margin-bottom:2px}
.seg{display:flex;gap:6px}.seg button{flex:1;padding:9px 0;font-weight:600}.seg .on{background:var(--ac);border-color:var(--ac)}
.pc{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:#17171b;border:1px solid var(--bd);border-left:4px solid var(--c);border-radius:12px;padding:8px;margin:8px 0}
.pc input{flex:1 1 120px;padding:8px 10px}.pc select{padding:8px;flex:1 1 90px;min-width:0}
.pp{width:40px;height:9px;border-radius:5px;flex:none;box-shadow:0 2px 4px rgba(0,0,0,.5)}
input[type=checkbox]{appearance:none;-webkit-appearance:none;width:46px;height:26px;border-radius:13px;padding:0;position:relative;cursor:pointer;background:#2a2a30;transition:background .2s;flex:none}
input[type=checkbox]::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .2s}
input[type=checkbox]:checked{background:var(--ac);border-color:var(--ac)}input[type=checkbox]:checked::after{transform:translateX(20px)}
input[type=range]{accent-color:var(--ac);padding:0;width:150px;border:0;background:none}
.steps{counter-reset:s;list-style:none;padding:0}.steps li{counter-increment:s;display:flex;gap:12px;align-items:center;background:#17171b;border-radius:12px;padding:10px 12px;margin:8px 0}
.steps li::before{content:counter(s);width:26px;height:26px;border-radius:50%;background:var(--ac);display:grid;place-items:center;font-weight:700;flex:none}
.win{text-align:center}.win .tr{font-size:56px;line-height:1}.win h2{font-size:30px;margin:.2em 0 .6em}
.rk{display:flex;align-items:center;gap:10px;background:#17171b;border-radius:10px;padding:9px 12px;margin:6px 0}.rk b{margin-left:auto}
#toast{background:rgba(17,17,20,.92);backdrop-filter:blur(8px);box-shadow:0 8px 24px rgba(0,0,0,.5);font-weight:600}
@media(max-width:560px){#order em,#turn small{display:none}.p{padding:16px}}

/* Pen picker / AI match setup refresh */
.p:has(.setup-screen){max-width:920px;padding:0;overflow:auto;background:#0d0d10;border-color:#303036}
.setup-screen{--hot:#e34355;padding:clamp(16px,3vw,30px);background:radial-gradient(ellipse at 90% 0,rgba(220,53,69,.14),transparent 38%),#101013}
.setup-hero{padding:5px 0 22px;border-bottom:1px solid #2a2a30}
.setup-kicker{font-size:10px;letter-spacing:.18em;font-weight:800;color:#f16c7b}
.setup-hero h2{font-size:clamp(28px,5vw,42px);letter-spacing:-.045em;margin:8px 0 2px}
.setup-hero h2 span{color:var(--hot)}
.setup-hero p,.section-head p,.editor-title p{color:var(--mu);font-size:13px;margin:4px 0 0}
.mode-pill{display:inline-flex;align-items:center;gap:8px;margin-top:14px;padding:7px 11px;border:1px solid #3e272d;background:#211418;border-radius:99px;color:#ff9ba6;font-size:10px;font-weight:800;letter-spacing:.08em}
.mode-pill i{width:5px;height:5px;background:#ff6577;box-shadow:0 0 9px #ff6577}
.setup-section{padding:20px 0;border-bottom:1px solid #2a2a30}
.section-head{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:12px}
.section-head h3,.editor-title h3{font-size:17px;letter-spacing:-.02em;margin:0}
.player-count{display:flex;gap:10px;align-items:center}
.player-count>span,.gallery-head>span{font-size:10px;letter-spacing:.13em;color:var(--mu);font-weight:800}
.player-count .seg{gap:4px}.player-count .seg button{min-width:30px;padding:6px 0;font-size:12px}
.roster-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.roster-card{display:flex;flex-direction:column;text-align:left;gap:6px;padding:12px;background:linear-gradient(155deg,#1a1a20,#141418);border:1px solid #303038;border-radius:14px;min-width:0;transition:border-color .15s,transform .15s}
.roster-card.active{border-color:var(--player-color);box-shadow:0 0 0 1px color-mix(in srgb,var(--player-color) 35%,transparent),inset 0 0 25px color-mix(in srgb,var(--player-color) 9%,transparent)}
.roster-head{display:flex;align-items:center;gap:6px;width:100%}
.roster-dot{width:7px;height:7px;border-radius:50%;background:var(--player-color);box-shadow:0 0 10px var(--player-color)}
.role-label{font-size:9px;font-weight:850;letter-spacing:.08em;color:#d5d5dc}
.roster-num{margin-left:auto;color:#74747e;font-size:10px}
.roster-preview{height:54px;display:flex;align-items:center;justify-content:center;overflow:hidden;background:radial-gradient(ellipse,#292930,#18181d 70%);border-radius:9px;margin:4px 0}
.roster-preview img{max-width:90%;max-height:48px;object-fit:contain}
.roster-preview .pen-shape{width:80%;height:9px}
.roster-card>strong{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.roster-pen-name{font-size:11px;color:var(--mu);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.roster-edit{margin-top:4px;font-size:9px;letter-spacing:.1em;color:var(--player-color);font-weight:900}
.pen-editor{padding:20px 0 14px}
.editor-title{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}
.editor-title h3{margin-top:4px;font-size:21px}.editor-badge{font-size:9px;font-weight:900;letter-spacing:.12em;color:var(--player-color);border:1px solid var(--player-color);padding:6px 8px;border-radius:6px}
.player-fields{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:19px}
.player-fields label{display:flex;flex-direction:column;align-items:stretch;gap:6px;margin:0;color:#bdbdc7;font-size:11px;font-weight:700}
.player-fields input,.player-fields select{width:100%;min-width:0;background:#19191f;padding:10px 12px;font-size:13px}
.gallery-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.gallery-head h4{font-size:13px;margin:0}
.pen-gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.bench-gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:9px}
.bench-option{display:flex;min-width:0;flex-direction:column;gap:7px;text-align:left;padding:8px;border:1px solid #303038;background:#17171c;border-radius:11px}
.bench-option.selected{border-color:#e34355;background:linear-gradient(150deg,rgba(227,67,85,.14),#17171c);box-shadow:inset 0 0 0 1px rgba(227,67,85,.3)}
.bench-art{height:76px;display:flex;align-items:center;justify-content:center;overflow:hidden;border-radius:7px;background:#222228}
.bench-art img{width:100%;height:100%;object-fit:contain}
.bench-art.procedural-bench{background:linear-gradient(135deg,#70451f,#b98248 30%,#7d4b25 55%,#b27b43 75%,#60391d);border:5px solid #4b2c17;box-shadow:inset 0 0 0 2px #d6a16a}
.bench-option strong{font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bench-option small{font-size:9px;letter-spacing:.08em;color:#92929e;font-weight:900}
.bench-option.selected small{color:#ff8996}
.pen-option{min-width:0;text-align:left;display:flex;flex-direction:column;gap:7px;padding:8px;border:1px solid #303038;background:#17171c;border-radius:11px}
.pen-option.selected{border-color:var(--player-color);background:linear-gradient(150deg,color-mix(in srgb,var(--player-color) 13%,#17171c),#17171c);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--player-color) 30%,transparent)}
.pen-art{height:55px;width:100%;display:flex;align-items:center;justify-content:center;overflow:hidden;border-radius:7px;background:radial-gradient(ellipse,#292930,#1a1a1f 75%)}
.pen-art img{width:95%;height:95%;object-fit:contain;filter:drop-shadow(0 3px 3px #0008)}
.pen-shape{display:block;position:relative;width:85%;height:9px;border-radius:99px;background:linear-gradient(180deg,#ffffffa3 0%,var(--pen-color) 27%,var(--pen-color) 72%,#111 100%);box-shadow:0 3px 5px #000a}
.pen-shape:before{content:"";position:absolute;left:-8px;top:1px;width:10px;height:7px;clip-path:polygon(100% 0,100% 100%,0 50%);background:linear-gradient(90deg,#bec3cc,#fff)}
.pen-shape:after{content:"";position:absolute;right:0;top:-1px;width:16px;height:11px;border-radius:0 6px 6px 0;background:linear-gradient(180deg,#9aa0a8,var(--pen-color),#08080a)}
.pen-option-name{font-size:11px;font-weight:750;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pen-option-status{font-size:9px;font-weight:900;letter-spacing:.08em;color:#92929e}
.pen-option.selected .pen-option-status{color:var(--player-color)}
.setup-footer{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:16px;border-top:1px solid #2a2a30}
.setup-footer>span{font-size:11px;color:var(--mu)}
.setup-footer .g2{display:flex;gap:8px}
.setup-footer button{padding:10px 15px}
@media(max-width:620px){.p:has(.setup-screen){max-width:100%;width:100%;max-height:100%;border-radius:14px}.section-head{align-items:flex-start;flex-direction:column}.player-count{width:100%;justify-content:space-between}.roster-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.roster-card:last-child:nth-child(odd){grid-column:1/-1}.pen-gallery{grid-template-columns:repeat(2,minmax(0,1fr))}.player-fields{grid-template-columns:1fr}.setup-footer{align-items:stretch;flex-direction:column}.setup-footer .g2{width:100%}.setup-footer button{flex:1}}
</style></head><body>
<div id="top"><div id="turn"></div><div id="order"></div><div id="pwr" title="Flick power"><div id="pwf"></div></div>
<button data-a="pause" aria-label="Pause">⏸</button><button data-a="rst" aria-label="Restart">↻</button><button data-a="menu" aria-label="Main menu">☰</button></div>
<div id="stage"><canvas id="c" aria-label="Pen Game bench"></canvas></div>
<div id="scr"></div><div id="toast" role="status"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
<script>
(()=>{
const {Engine,Bodies,Body,Composite,Events}=Matter;
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
/* ---------- constants ---------- */
const W=960,H=600,B={x:40,y:40,w:880,h:520,r:26},CX=B.x+B.w/2,CY=B.y+B.h/2,PL=84,PW=11,MAXD=150;
const PC=['#3b82f6','#f59e0b','#22c55e','#a855f7','#06b6d4','#ec4899'];
const PENS=[{n:'Blue ballpoint',c:'#2563eb',t:'#111827'},{n:'Black ballpoint',c:'#26262b',t:'#0a0a0a'},{n:'Red ballpoint',c:'#dc2626',t:'#1f2937'},{n:'Clear plastic',c:'rgba(215,235,255,.55)',t:'#374151',ink:'#2563eb'},{n:'Neon green',c:'#84cc16',t:'#334155'},{n:'Orange student',c:'#f97316',t:'#334155'}];
const PHY={classic:.04,slick:.026,grippy:.06};
/* ---------- persistence ---------- */
const ld=(k,d)=>{try{return Object.assign({},d,JSON.parse(localStorage.getItem(k)))}catch(e){return d}};
const sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let S=ld('pg.s',{snd:1,vol:.6,rm:matchMedia('(prefers-reduced-motion:reduce)').matches,pw:1,asst:1,acc:0,phy:'classic'});
let ST=ld('pg.st',{p:0,w:0,e:0,rs:0,pens:{},st:0,bs:0,rec:[]});
if(!ST.pens||typeof ST.pens!='object')ST.pens={};if(!Array.isArray(ST.rec))ST.rec=[];
for(const k of['p','w','e','rs','st','bs'])if(!isFinite(ST[k]))ST[k]=0;
document.body.classList.toggle('rm',!!S.rm);
/* ---------- audio ---------- */
let AC;const snd=(f,d,ty='sine',v=.2,f2)=>{if(!S.snd||!S.vol)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;o.type=ty;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(Math.max(.0002,v*S.vol),t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d)}catch(e){}};
/* ---------- physics + rules (render-independent) ---------- */
const eng=Engine.create({gravity:{x:0,y:0,scale:0}});
let G=null,acc=0,last=0,shake=0,parts=[],drag=null,tmr=0,paused=false;
function onB(x,y){const r=B.r,dx=Math.max(B.x+r-x,0,x-(B.x+B.w-r)),dy=Math.max(B.y+r-y,0,y-(B.y+B.h-r));return x>=B.x&&x<=B.x+B.w&&y>=B.y&&y<=B.y+B.h&&dx*dx+dy*dy<=r*r}
function start(cfg){
 clearTimeout(tmr);Composite.clear(eng.world,false);parts=[];drag=null;paused=false;acc=0;
 const n=cfg.length,k=PHY[S.phy]||.04,off=Math.random()*6.28;
 const pl=cfg.map((c,i)=>{const a=off+Math.PI*2*i/n,x=CX+Math.cos(a)*(250+Math.random()*40),y=CY+Math.sin(a)*(130+Math.random()*30);
  const body=Bodies.rectangle(x,y,PL,PW,{chamfer:{radius:5},density:.002,frictionAir:k,friction:.25,frictionStatic:0,restitution:.55,angle:Math.random()*6.28});
  Composite.add(eng.world,body);return{i,name:c.name,ai:+c.ai,pen:+c.pen,alive:1,fell:0,rank:0,el:0,body}});
 G={id:Math.random(),cfg,pl,t:Math.floor(Math.random()*n),st:'aim',k,simT:0,sT:0,win:null};
 hud();toast(pl[G.t].name+'’s turn');sched()}
function hud(){const g=G;$('#top').style.display=g?'flex':'none';rs();if(!g)return;const c=g.pl[g.t];
 $('#turn').innerHTML=g.st==='over'?'Match over':`<i style="background:${PC[c.i]}"></i>${esc(c.name)}${c.ai?' (AI)':''} <small>${g.st==='aim'?(c.ai?'thinking…':'drag back, release'):'in motion…'}</small>`;
 $('#order').innerHTML=g.pl.map(p=>`<span class="${p.alive?'':'x'}${p===c&&g.st!=='over'?' on':''}"><i style="background:${PC[p.i]}"></i>${esc(p.name)}</span>`).join('')}
function flick(ang,pw,t=0){const p=G.pl[G.t],b=p.body;if(S.acc)ang+=(Math.random()-.5)*.16*(.4+pw);
 const sp=3+(22*S.pw-3)*Math.pow(pw,1.3);
 const dx=Math.cos(ang),dy=Math.sin(ang),rx=Math.cos(b.angle)*t,ry=Math.sin(b.angle)*t,w=(rx*dy-ry*dx)*sp*b.mass/b.inertia*.3;
 Body.setVelocity(b,{x:dx*sp,y:dy*sp});Body.setAngularVelocity(b,Math.max(-.35,Math.min(.35,w)));
 G.st='sim';G.simT=0;G.sT=0;acc=0;drag=null;snd(260+pw*300,.12,'square',.12,90);hud()}
function simCheck(dt){G.simT+=dt;let mv=0;
 for(const p of G.pl){if(!p.alive||p.fell)continue;const b=p.body,q=b.position;

<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#151311"><title>কলম খেলবি? — Pen Game 2.0</title><link rel="stylesheet" href="style.css">
</head>
<body><main class="app">
<header><a class="wordmark" href="#">কলম খেলবি<span>?</span></a><span class="version">PEN GAME <b>2.0</b></span></header>
<section class="arena-section"><div class="game-top"><div><span class="live-dot"></span><span id="status">ম্যাচের জন্য প্রস্তুত</span></div><div class="score"><span id="alive-count">৪</span><small>কলম বাকি</small></div></div>
<div class="table-wrap"><canvas id="board" aria-label="কলমের বেঞ্চ"></canvas><div id="overlay" class="overlay"><div class="overlay-card"><div class="mark">✳</div><h1>কলম খেলবি<span>?</span></h1><p>শেষ কলম পর্যন্ত টিকে থাকো।</p><button id="start" class="primary">খেলা শুরু</button></div></div></div>
<div class="players"><div class="player active" id="player-0"><i class="red"></i><span>তুমি</span><b>YOU</b></div><div class="player" id="player-1"><i class="blue"></i><span>নীল</span><b>AI</b></div><div class="player" id="player-2"><i class="green"></i><span>সবুজ</span><b>AI</b></div><div class="player" id="player-3"><i class="yellow"></i><span>হলুদ</span><b>AI</b></div></div>
<div class="bottom-bar"><span id="hint">নিজের কলমে টাচ করে পিছনে টেনে ছেড়ে দাও</span><button id="again" class="secondary">↻ আবার খেলি</button></div></section>
<footer><span>স্কুলের বেঞ্চ থেকে, ভালোবাসা নিয়ে।</span><a href="https://github.com/iammdtanvirrahman/pen-game/tree/2.0">SOURCE ↗</a></footer>
</main><script src="game.js"></script></body></html>

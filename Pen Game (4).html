<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Pen Game</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Permanent+Marker&display=swap">
<style>
/* Layout: full-screen game. HUD bar on top, canvas bench in the middle, modal panels for menus. Single dark look by choice. */
:root{--bg:#0b0b0d;--sf:#141418;--sf2:#1b1b21;--ln:#2b2b32;--tx:#f5f5f7;--mu:#a3a3ad;--ac:#dc3545;--ac2:#ff6577;--ok:#22c55e;--warn:#eab308;
--ff:"Hind Siliguri",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--fd:"Permanent Marker","Hind Siliguri",system-ui,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overscroll-behavior:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
body{display:flex;flex-direction:column;gap:8px;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--bg);color:var(--tx);font:16px/1.45 var(--ff);overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
#stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
#c{display:block;touch-action:none;border-radius:14px;max-width:100%}
button,select,input{font:inherit;color:var(--tx);background:var(--sf2);border:1px solid var(--ln);border-radius:10px;padding:9px 14px}
button{cursor:pointer;transition:transform .12s,filter .12s}
button:hover{filter:brightness(1.15)}button:active{transform:scale(.97)}
:focus-visible{outline:2px solid var(--tx);outline-offset:2px}
input[type=text]{user-select:text;-webkit-user-select:text;min-width:0}
button.pr{background:linear-gradient(180deg,#e8485a,#c52b3c);border-color:var(--ac);box-shadow:0 6px 18px rgba(220,53,69,.35);font-weight:600}

/* HUD */
#top{display:none;align-items:center;gap:10px 14px;flex-wrap:wrap;padding:8px 12px;background:linear-gradient(180deg,#18181d,#121216);border:1px solid var(--ln);border-radius:16px}
#turn{display:flex;align-items:center;gap:8px;padding:6px 14px 6px 10px;background:var(--sf2);border:1px solid var(--ln);border-radius:99px;font-weight:600;min-width:0}
#turn .dot{width:14px;height:14px;border-radius:50%;background:currentColor;box-shadow:0 0 10px currentColor;flex:none;animation:pop .4s}
#turn small{color:var(--mu);font-weight:400}
@keyframes pop{from{transform:scale(2.2)}}
#order{display:flex;gap:12px;flex:1;flex-wrap:wrap;min-width:0}
.chip{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mu);min-width:0}
.chip b{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:13px;color:#fff;background:var(--c);border:2px solid transparent;box-shadow:0 2px 8px rgba(0,0,0,.5);transition:transform .2s;flex:none}
.chip.on b{border-color:#fff;transform:scale(1.15);box-shadow:0 0 0 3px rgba(255,255,255,.15),0 0 14px var(--c)}
.chip.on em{color:var(--tx)}
.chip.x b{background:#26262b;color:var(--mu)}.chip.x{opacity:.55}
.chip em{font-style:normal;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:90px}
.pips{display:flex;gap:3px}.pips i{display:block;width:8px;height:8px;border-radius:50%;border:1.5px solid var(--c)}.pips i.f{background:var(--c)}
#ser{font-size:12px;color:var(--mu);white-space:nowrap}
#clk{display:flex;align-items:center;justify-content:center;min-width:48px;height:34px;padding:0 10px;border-radius:99px;border:1px solid var(--ln);background:var(--sf2);font-weight:700;font-variant-numeric:tabular-nums}
#clk.low{border-color:var(--ac);color:var(--ac2);animation:blink .5s infinite alternate}
@keyframes blink{to{background:#3a141a}}
#pwr{width:110px;height:10px;border-radius:5px;background:var(--sf2);border:1px solid var(--ln);overflow:hidden}
#pwf{height:100%;width:0;background:linear-gradient(90deg,#22c55e,#eab308,#dc3545) left/110px 100%}
#top button{width:44px;height:44px;padding:0;border-radius:50%;display:grid;place-items:center}
#toast{position:fixed;left:50%;top:calc(76px + env(safe-area-inset-top,0px));transform:translateX(-50%);max-width:calc(100% - 32px);text-align:center;background:rgba(17,17,20,.92);border:1px solid var(--ac);padding:8px 16px;border-radius:99px;box-shadow:0 8px 24px rgba(0,0,0,.5);font-weight:600;opacity:0;transition:opacity .25s;pointer-events:none;z-index:6}
#toast.on{opacity:1}

/* Panels */
#scr{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));overflow:auto;overscroll-behavior:contain;z-index:5;background:radial-gradient(ellipse at 50% 0,rgba(220,53,69,.14),rgba(8,8,8,.92) 62%)}
.p{background:linear-gradient(180deg,#17171b,#101013);border:1px solid #2b2b31;border-radius:16px;padding:22px;max-width:520px;width:100%;max-height:100%;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.6);animation:rise .35s cubic-bezier(.2,.8,.2,1)}
.p.still{animation:none}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.98)}}
.p h2,.p h3{margin:.2em 0 .5em}.p h3{font-size:13px;color:var(--mu);text-transform:uppercase;letter-spacing:.08em;margin-top:1.2em}
.p label{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:10px 0}
.g{display:grid;gap:10px;margin-top:14px}.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mu{color:var(--mu);font-size:14px}
.logo{text-align:center}
.logo b{display:block;font:400 clamp(44px,10vw,64px)/1.05 var(--fd);letter-spacing:.01em;transform:rotate(-2deg)}
.logo b span{color:var(--ac2)}
.logo .bn{font-size:18px;color:var(--mu)}.logo p{margin:2px 0 0}
.pg{height:16px;width:190px;margin:14px auto 4px;border-radius:8px;background:linear-gradient(90deg,#1e1e22 12%,#dc3545 12% 18%,#2563eb 18% 88%,#111 88%);filter:drop-shadow(0 10px 8px rgba(0,0,0,.6));animation:sw 3.5s ease-in-out infinite alternate}
@keyframes sw{from{transform:translateX(-30px) rotate(-4deg)}to{transform:translateX(30px) rotate(4deg)}}
.st{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.st div{background:#18181c;border:1px solid var(--ln);border-radius:12px;padding:10px 6px}
.st b{display:block;font-size:20px;font-variant-numeric:tabular-nums}.st span{font-size:12px;color:var(--mu)}
.kick{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ac2);font-weight:700;text-align:center}
.win{text-align:center}.win h2{font:400 clamp(28px,7vw,38px)/1.1 var(--fd);margin:.2em 0 .5em}
.score{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:6px 0 12px}
.score div{min-width:72px;text-align:center;background:#18181c;border:1px solid var(--ln);border-bottom:3px solid var(--c);border-radius:10px;padding:6px 10px}
.score b{display:block;font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums}.score span{font-size:12px;color:var(--mu);display:block;max-width:96px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rk{display:flex;align-items:center;gap:10px;background:#17171b;border-left:4px solid var(--c);border-radius:10px;padding:8px 12px;margin:6px 0}
.rk .pos{width:34px;font-weight:700;color:var(--mu);font-variant-numeric:tabular-nums}.rk .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rk small{color:var(--mu)}.rk .ms{font-size:12px;color:var(--mu);white-space:nowrap}
ol.steps{counter-reset:s;list-style:none;padding:0}
ol.steps li{counter-increment:s;display:flex;gap:12px;align-items:center;background:#17171b;border-radius:12px;padding:10px 12px;margin:8px 0}
ol.steps li::before{content:counter(s);width:26px;height:26px;border-radius:50%;background:var(--ac);display:grid;place-items:center;font-weight:700;flex:none}
input[type=checkbox]{appearance:none;-webkit-appearance:none;width:46px;height:26px;border-radius:13px;padding:0;position:relative;cursor:pointer;background:#2a2a30;transition:background .2s;flex:none}
input[type=checkbox]::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .2s}
input[type=checkbox]:checked{background:var(--ac);border-color:var(--ac)}input[type=checkbox]:checked::after{transform:translateX(20px)}
input[type=range]{accent-color:var(--ac);padding:0;width:150px;border:0;background:none}
.seg{display:flex;gap:4px}.seg button{flex:1;padding:8px 0;font-weight:600;font-size:13px}.seg button.on{background:var(--ac);border-color:var(--ac)}

/* Match setup */
.p:has(.setup-screen){max-width:920px;padding:0;background:#0d0d10;border-color:#303036}
.setup-screen{padding:clamp(16px,3vw,30px);background:radial-gradient(ellipse at 90% 0,rgba(220,53,69,.14),transparent 38%),#101013}
.setup-hero{padding:5px 0 20px;border-bottom:1px solid var(--ln)}
.setup-kicker{font-size:10px;letter-spacing:.18em;font-weight:700;color:#f16c7b;text-transform:uppercase}
.setup-hero h2{font:400 clamp(30px,5vw,44px)/1.1 var(--fd);margin:8px 0 2px}.setup-hero h2 span{color:var(--ac)}
.setup-hero p,.section-head p,.editor-title p{color:var(--mu);font-size:13px;margin:4px 0 0}
.mode-pill{display:inline-block;margin-top:14px;padding:6px 12px;border:1px solid #3e272d;background:#211418;border-radius:99px;color:#ff9ba6;font-size:10px;font-weight:700;letter-spacing:.08em}
.setup-section{padding:20px 0;border-bottom:1px solid var(--ln)}
.section-head{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:12px}
.section-head h3,.editor-title h3{font-size:17px;margin:0;text-transform:none;letter-spacing:-.01em;color:var(--tx)}
.player-count{display:flex;gap:10px;align-items:center}
.player-count>span,.gallery-head>span,.rule>span{font-size:10px;letter-spacing:.13em;color:var(--mu);font-weight:700}
.player-count .seg button{min-width:40px;padding:6px 0;font-size:14px}
.roster-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.roster-card{display:flex;flex-direction:column;text-align:left;gap:6px;padding:12px;background:linear-gradient(155deg,#1a1a20,#141418);border:1px solid #303038;border-radius:14px;min-width:0}
.roster-card.active{border-color:var(--player-color);box-shadow:inset 0 0 25px color-mix(in srgb,var(--player-color) 10%,transparent)}
.roster-head{display:flex;align-items:center;gap:6px;width:100%}
.roster-dot{width:7px;height:7px;border-radius:50%;background:var(--player-color);box-shadow:0 0 10px var(--player-color)}
.role-label{font-size:9px;font-weight:700;letter-spacing:.08em;color:#d5d5dc}
.roster-num{margin-left:auto;color:#74747e;font-size:10px}
.roster-preview,.pen-art{display:flex;align-items:center;justify-content:center;overflow:hidden;background:radial-gradient(ellipse,#292930,#18181d 75%);border-radius:9px}
.roster-preview{height:54px;margin:4px 0}.pen-art{height:55px;width:100%;border-radius:7px}
.roster-preview img{max-width:92%;max-height:48px;object-fit:contain}.pen-art img{width:95%;height:95%;object-fit:contain;filter:drop-shadow(0 3px 3px #0008)}
.roster-card>strong{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.roster-pen-name{font-size:11px;color:var(--mu);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.roster-edit{margin-top:4px;font-size:9px;letter-spacing:.1em;color:var(--player-color);font-weight:700}
.rules-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.rule{display:flex;flex-direction:column;gap:6px;min-width:0}.rule .seg button{padding:8px 2px;font-size:12px}
.pen-editor{padding:20px 0 14px}
.editor-title{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}
.editor-title h3{margin-top:4px;font-size:21px}
.editor-badge{font-size:9px;font-weight:700;letter-spacing:.12em;color:var(--player-color);border:1px solid var(--player-color);padding:6px 8px;border-radius:6px}
.player-fields{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:19px}
.player-fields label{display:flex;flex-direction:column;align-items:stretch;gap:6px;margin:0;color:#bdbdc7;font-size:11px;font-weight:600}
.player-fields input,.player-fields select{width:100%;min-width:0;background:#19191f;padding:10px 12px;font-size:16px}
.gallery-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}.gallery-head h4{font-size:13px;margin:0}
.pen-gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.pen-option{min-width:0;text-align:left;display:flex;flex-direction:column;gap:7px;padding:8px;border:1px solid #303038;background:#17171c;border-radius:11px}
.pen-option.selected{border-color:var(--player-color);background:linear-gradient(150deg,color-mix(in srgb,var(--player-color) 13%,#17171c),#17171c)}
.pen-option-name{font-size:11px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pen-option-status{font-size:9px;font-weight:700;letter-spacing:.08em;color:#92929e}.pen-option.selected .pen-option-status{color:var(--player-color)}
.setup-footer{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:16px;border-top:1px solid var(--ln)}
.setup-footer>span{font-size:11px;color:var(--mu)}.setup-footer .g2{display:flex;gap:8px;margin:0}.setup-footer button{padding:10px 15px}
@media(max-width:620px){
 .roster-grid,.pen-gallery{grid-template-columns:repeat(2,minmax(0,1fr))}.roster-card:last-child:nth-child(odd){grid-column:1/-1}
 .rules-grid,.player-fields{grid-template-columns:1fr}.section-head{align-items:flex-start;flex-direction:column}.player-count{width:100%;justify-content:space-between}
 .setup-footer{align-items:stretch;flex-direction:column}.setup-footer .g2{width:100%}.setup-footer button{flex:1}
 .chip em,#turn small{display:none}.p{padding:16px}.p:has(.setup-screen){padding:0}}
@media(max-width:620px){#pwr{display:none}#top{padding:6px 8px;gap:6px 8px}.chip b{width:28px;height:28px}#order{gap:8px}}
@media(max-height:480px){body{padding-block:4px;gap:4px}#top{padding:4px 8px;gap:4px 8px}#turn{padding:3px 10px 3px 8px}#turn small,.chip em,#pwr{display:none}.chip b{width:26px;height:26px}#top button{width:40px;height:40px}.p{padding:14px}#toast{top:calc(56px + env(safe-area-inset-top,0px))}}
@media(pointer:coarse){button,select,input[type=text],.seg button{min-height:44px}}
.rm *{animation:none!important;transition:none!important}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>

<div id="top">
 <div id="turn"></div>
 <div id="order"></div>
 <div id="ser" hidden></div>
 <div id="clk" hidden title="Shot clock"></div>
 <div id="pwr" title="Flick power"><div id="pwf"></div></div>
 <button data-a="pause" aria-label="Pause"><svg viewBox="0 0 16 16" width="16" height="16" fill="currentColor"><rect x="3" y="2" width="3.5" height="12" rx="1"/><rect x="9.5" y="2" width="3.5" height="12" rx="1"/></svg></button>
 <button data-a="rr" aria-label="Restart round"><svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M13 8a5 5 0 1 1-1.6-3.7"/><path d="M13 2.5v3h-3"/></svg></button>
 <button data-a="menu" aria-label="Main menu"><svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M2.5 4h11M2.5 8h11M2.5 12h11"/></svg></button>
</div>
<div id="stage"><canvas id="c" aria-label="Pen Game bench"></canvas></div>
<div id="scr"></div><div id="toast" role="status"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
<script>
(()=>{
const {Engine,Bodies,Body,Composite,Events}=Matter;
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const ord=n=>n+(n%100>=11&&n%100<=13?'th':['th','st','nd','rd'][n%10]||'th');

/* ---------- constants ---------- */
const W=960,H=600,B={x:40,y:40,w:880,h:520,r:26},CX=B.x+B.w/2,CY=B.y+B.h/2,PL=84,PW=11,MAXD=150,VMAX=22,Q=4;
const PC=['#3b82f6','#f59e0b','#22c55e','#a855f7','#06b6d4','#ec4899'];
const PENS=[
 {n:'Blue ballpoint',k:'click',c:'#1e40af',g:'#14171d',ink:'#1e40af'},
 {n:'Black ballpoint',k:'click',c:'#2b2d33',g:'#0b0b0d',ink:'#111111'},
 {n:'Red ballpoint',k:'click',c:'#c62828',g:'#17171a',ink:'#dc2626'},
 {n:'Clear hex pen',k:'stick',c:'rgba(205,228,255,.34)',cap:'#2563eb',ink:'#2563eb'},
 {n:'Neon green',k:'click',c:'#6fbf0a',g:'#2a313c',ink:'#65a30d'},
 {n:'Orange student',k:'stick',c:'rgba(255,214,170,.36)',cap:'#f97316',ink:'#ea580c'}];
const BUILTIN=PENS.length;
const PHY={classic:.04,slick:.026,grippy:.06};
const OBS={eraser:{w:58,h:26,n:'the eraser'},sharpener:{w:36,h:24,n:'the sharpener'},glue:{r:17,n:'the glue stick'}};
const SERIES=[[1,'Single'],[3,'Best of 3'],[5,'Best of 5']],CLOCKS=[[0,'Off'],[15,'15 s'],[30,'30 s']],CLUTTER=[[0,'Clear'],[1,'Eraser'],[2,'Cluttered']];

/* ---------- persistence ---------- */
const ld=(k,d)=>{try{return Object.assign({},d,JSON.parse(localStorage.getItem(k)))}catch(e){return d}};
const sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let S=ld('pg.s',{snd:1,vol:.6,rm:matchMedia('(prefers-reduced-motion:reduce)').matches,pw:1,acc:0,phy:'classic',ink:1,vib:1,hint:0});
let ST=ld('pg.st',{p:0,w:0,e:0,rs:0,pens:{},st:0,bs:0,sh:0,ht:0,sp:0,sw:0,rec:[]});
if(!ST.pens||typeof ST.pens!=='object')ST.pens={};if(!Array.isArray(ST.rec))ST.rec=[];
for(const k of['p','w','e','rs','st','bs','sh','ht','sp','sw'])if(!isFinite(ST[k]))ST[k]=0;
document.body.classList.toggle('rm',!!S.rm);

/* ---------- audio ---------- */
let AC;const snd=(f,d,ty='sine',v=.2,f2)=>{if(!S.snd||!S.vol)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;o.type=ty;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(Math.max(.0002,v*S.vol),t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d)}catch(e){}};

let vibT=0;const vib=p=>{try{const t=Date.now();if(S.vib&&typeof navigator!=='undefined'&&navigator.vibrate&&t-vibT>60){vibT=t;navigator.vibrate(p)}}catch(e){}};
let wakeLk=null;
const wake=()=>{try{if(typeof navigator!=='undefined'&&navigator.wakeLock&&!wakeLk&&!document.hidden)navigator.wakeLock.request('screen').then(l=>{wakeLk=l;l.addEventListener('release',()=>{wakeLk=null})}).catch(()=>{})}catch(e){}};
function touchHint(){try{if(S.hint||!matchMedia('(pointer:coarse)').matches)return;S.hint=1;sv('pg.s',S);setTimeout(()=>toast('Drag back from your pen, then let go to flick',3400),1500)}catch(e){}}
/* ---------- assets (EXTEND HERE) ----------
 PEN SKIN (image): Assets.addPen({n:'Name', src:'path-or-dataURL.png', len:84, band:-10})  transparent PNG, pen pointing right.
 PEN (procedural): Assets.addPen({n, k:'click'|'stick', c:barrel, g:grip, cap:capColour, ink:inkColour})
 BENCH: Assets.setBench('image.jpg') stretches over the 960x600 world; setBench(null) restores the procedural bench.
 MANIFEST: Assets.loadManifest({bench:{src}, pens:[{n,src}]}) or open the page with ?assets=assets/manifest.json
 Physics never reads assets, so skins cannot change gameplay. */
const Assets={bench:{img:null,proc:null},cache:new Map(),
 load(src){return new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=src})},

/* ---------- geometry helpers ---------- */
const ptSeg=(px,py,ax,ay,bx,by)=>{const dx=bx-ax,dy=by-ay,l=dx*dx+dy*dy,t=l?clamp(((px-ax)*dx+(py-ay)*dy)/l,0,1):0;return Math.hypot(ax+dx*t-px,ay+dy*t-py)};
const segX=(x1,y1,x2,y2,x3,y3,x4,y4)=>{const d=(x2-x1)*(y4-y3)-(y2-y1)*(x4-x3);if(!d)return false;const t=((x3-x1)*(y4-y3)-(y3-y1)*(x4-x3))/d,u=((x3-x1)*(y2-y1)-(y3-y1)*(x2-x1))/d;return t>=0&&t<=1&&u>=0&&u<=1};
const segD=(x1,y1,x2,y2,x3,y3,x4,y4)=>segX(x1,y1,x2,y2,x3,y3,x4,y4)?0:Math.min(ptSeg(x1,y1,x3,y3,x4,y4),ptSeg(x2,y2,x3,y3,x4,y4),ptSeg(x3,y3,x1,y1,x2,y2),ptSeg(x4,y4,x1,y1,x2,y2));
function onB(x,y){const r=B.r,dx=Math.max(B.x+r-x,0,x-(B.x+B.w-r)),dy=Math.max(B.y+r-y,0,y-(B.y+B.h-r));return x>=B.x&&x<=B.x+B.w&&y>=B.y&&y<=B.y+B.h&&dx*dx+dy*dy<=r*r}
function hitObs(o,x,y,ca,sa){for(const t of[-37,-18,0,18,37]){const px=x+ca*t,py=y+sa*t;
 if(o.r){if(Math.hypot(px-o.x,py-o.y)<o.r+5.5)return true}
 else{const dx=px-o.x,dy=py-o.y,lx=dx*Math.cos(o.a)+dy*Math.sin(o.a),ly=-dx*Math.sin(o.a)+dy*Math.cos(o.a);if(Math.abs(lx)<o.w/2+5&&Math.abs(ly)<o.h/2+5)return true}}return false}
/* Walks the pen straight along `ang` and reports what it meets first. Spin is ignored, so this is a close estimate. */
function sweep(p,ang,maxD){const b=p.body,dx=Math.cos(ang),dy=Math.sin(ang),ca=Math.cos(b.angle),sa=Math.sin(b.angle);
 const F=G.pl.filter(q=>q!==p&&q.alive&&!q.fell).map(q=>{const a=q.body.angle,c=Math.cos(a)*37,s=Math.sin(a)*37,x=q.body.position.x,y=q.body.position.y;return{q,ax:x-c,ay:y-s,bx:x+c,by:y+s}});
 let px=b.position.x,py=b.position.y;
 for(let d=3;d<=maxD;d+=3){const x=b.position.x+dx*d,y=b.position.y+dy*d;
  if(!onB(x,y))return{k:'edge',x,y,d};
  for(const f of F)if(segD(x-ca*37,y-sa*37,x+ca*37,y+sa*37,f.ax,f.ay,f.bx,f.by)<PW)return{k:'pen',q:f.q,x:px,y:py,d};
  for(const o of G.obs)if(hitObs(o,x,y,ca,sa))return{k:'obs',o,x:px,y:py,d};
  px=x;py=y}
 return{k:'none',x:px,y:py,d:maxD}}

/* ---------- game state ---------- */
const eng=Engine.create({gravity:{x:0,y:0,scale:0}});
let G=null,M=null,acc=0,last=0,shake=0,parts=[],drag=null,tmr=0,paused=false,topOn=false;
const ink=document.createElement('canvas');ink.width=W*1.25;ink.height=H*1.25;const ig=ink.getContext('2d');ig.scale(1.25,1.25);ig.lineCap='round';
let inkUsed=false;const inkClear=()=>{ig.clearRect(0,0,W,H);inkUsed=false};

function normCfg(c){c=c||{};const pick=(list,v)=>list.some(x=>x[0]===+v)?+v:list[0][0];return{...c,series:pick(SERIES,c.series),clock:pick(CLOCKS,c.clock),clutter:pick(CLUTTER,c.clutter),pl:(c.pl||[0,1].map(i=>({name:'Player '+(i+1),ai:0,pen:i}))).map((p,i)=>({name:String(p.name||'Player').slice(0,14),ai:clamp(+p.ai||0,0,3),pen:+p.pen<PENS.length&&+p.pen>=0?+p.pen:i%BUILTIN}))}}
function begin(cfg){wake();M={cfg,scores:cfg.pl.map(()=>0),round:1,need:Math.ceil(cfg.series/2),first:Math.floor(Math.random()*cfg.pl.length)};round();touchHint()}
function makeObs(lv){const kinds=lv===1?['eraser']:lv===2?['eraser','sharpener','glue']:[],out=[];
 for(const k of kinds){const D=OBS[k];let x,y,t=0;do{x=CX+(Math.random()-.5)*280;y=CY+(Math.random()-.5)*110;t++}while(t<40&&out.some(o=>Math.hypot(o.x-x,o.y-y)<100));
  const a=Math.random()*Math.PI,o={k,x,y,a,w:D.w||0,h:D.h||0,r:D.r||0,n:D.n};
  o.body=D.r?Bodies.circle(x,y,D.r,{isStatic:true,restitution:.6,friction:0,label:'obs'}):Bodies.rectangle(x,y,D.w,D.h,{isStatic:true,angle:a,chamfer:{radius:4},restitution:.6,friction:0,label:'obs'});
  o.sp=obsSprite(o);out.push(o)}
 return out}
function round(){const cfg=M.cfg;clearTimeout(tmr);Composite.clear(eng.world,false);if(Engine.clear)Engine.clear(eng);parts=[];drag=null;paused=false;acc=0;inkClear();
 const n=cfg.pl.length,k=PHY[S.phy]||.04,off=Math.random()*6.28,obs=makeObs(cfg.clutter|0);
 const pl=cfg.pl.map((c,i)=>{const a=off+Math.PI*2*i/n,x=CX+Math.cos(a)*(250+Math.random()*40),y=CY+Math.sin(a)*(130+Math.random()*30);
  const body=Bodies.rectangle(x,y,PL,PW,{label:'pen',chamfer:{radius:5},density:.002,frictionAir:k,friction:.25,frictionStatic:0,restitution:.55,angle:Math.random()*6.28});
  return{i,name:c.name,ai:+c.ai,pen:+c.pen,alive:1,fell:0,rank:0,el:0,sh:0,ht:0,body,lt:null}});
 Composite.add(eng.world,[...obs.map(o=>o.body),...pl.map(p=>p.body)]);
 G={id:Math.random(),cfg,pl,obs,t:(M.first+M.round-1)%n,st:'aim',k,simT:0,sT:0,win:null,clk:0,cs:-1,hit:0};
 turnStart();hud();toast(cfg.series>1?`Round ${M.round} · ${pl[G.t].name} starts`:pl[G.t].name+'’s turn');sched()}
function turnStart(){G.clk=G.cfg.clock&&!G.pl[G.t].ai?G.cfg.clock*1000:0;G.cs=-1}
function nextTurn(){do G.t=(G.t+1)%G.pl.length;while(!G.pl[G.t].alive);G.st='aim';turnStart();hud();sched()}
function timeUp(){const p=G.pl[G.t];drag=null;G.clk=0;toast(p.name+' ran out of time');snd(150,.35,'sawtooth',.15,70);nextTurn()}

function clockUI(){const e=$('#clk'),on=G&&G.st==='aim'&&G.cfg.clock&&!G.pl[G.t].ai;e.hidden=!on;if(on){e.textContent=Math.max(0,Math.ceil(G.clk/1000));e.classList.toggle('low',G.clk<=5000)}}
const ini=n=>(String(n).trim()[0]||'?').toUpperCase();
function hud(){const g=G,on=!!g;if(on!==topOn){topOn=on;$('#top').style.display=on?'flex':'none';rs()}if(!g)return;

  return`<span class="chip${p.alive?'':' x'}${p===c&&g.st!=='over'?' on':''}" title="${esc(p.name)}"><b style="--c:${PC[p.i]}">${p.alive?esc(ini(p.name)):'✕'}</b><em>${esc(p.name)}</em>${pips}</span>`}).join('');

/* ---------- turn flow ---------- */
function flick(ang,pw,t=0){const p=G.pl[G.t],b=p.body;if(S.acc)ang+=(Math.random()-.5)*.16*(.4+pw);
 const sp=3+(VMAX*S.pw-3)*Math.pow(pw,1.3);
 const dx=Math.cos(ang),dy=Math.sin(ang),rx=Math.cos(b.angle)*t,ry=Math.sin(b.angle)*t,w=(rx*dy-ry*dx)*sp*b.mass/b.inertia*.3;

 p.sh++;G.hit=0;p.lt=null;G.st='sim';G.simT=0;G.sT=0;acc=0;drag=null;snd(260+pw*300,.12,'square',.12,90);vib(12);hud()}
function simCheck(dt){G.simT+=dt;let mv=0;

  if(!onB(q.x,q.y)){p.fell=1;p.ft=performance.now();b.collisionFilter.mask=0;snd(520,.5,'triangle',.18,110);vib([40,30,40])}
  else if(b.speed>.12||Math.abs(b.angularSpeed)>.004)mv=1}

 const cur=G.pl[G.t],out=G.pl.filter(p=>p.alive&&p.fell),left=G.pl.filter(p=>p.alive&&!p.fell);
 out.forEach(p=>{p.alive=0;p.rank=left.length+1;if(p!==cur)cur.el++;Composite.remove(eng.world,p.body)});
 if(out.length)toast(out.map(p=>p.name).join(' & ')+' eliminated');
 if(left.length<=1)return roundEnd(left[0]||null);
 nextTurn()}
function inkStep(){if(!S.ink)return;for(const p of G.pl){if(!p.alive||p.fell)continue;const b=p.body,tx=b.position.x+Math.cos(b.angle)*40,ty=b.position.y+Math.sin(b.angle)*40,d=PENS[p.pen]||PENS[0];
 if(p.lt&&b.speed>1.2){ig.globalAlpha=Math.min(.5,.12+b.speed*.02);ig.strokeStyle=d.ink||d.c;ig.lineWidth=1.3;ig.beginPath();ig.moveTo(p.lt[0],p.lt[1]);ig.lineTo(tx,ty);ig.stroke();inkUsed=true}p.lt=[tx,ty]}ig.globalAlpha=1}

/* ---------- round and series results ---------- */
function roundEnd(w){G.st='over';G.win=w;if(w){w.rank=1;M.scores[w.i]++}
 const ser=M.cfg.series>1,fin=M.scores.findIndex(s=>s>=M.need),done=!ser||fin>=0,sw=fin>=0?G.pl[fin]:null,p0=G.pl[0];
 ST.rec.unshift((ser?`R${M.round} · `:'')+(w?w.name+' won':'Draw')+' · '+G.pl.length+' players');
 if(done&&ser)ST.rec.unshift(`Series ${M.scores.join('–')} · ${sw.name} won`);
 ST.rec.length=Math.min(6,ST.rec.length);
 if(!p0.ai){ST.p++;ST.rs+=p0.rank||1;ST.e+=p0.el;ST.sh+=p0.sh;ST.ht+=p0.ht;ST.pens[p0.pen]=(ST.pens[p0.pen]||0)+1;
  if(w===p0){ST.w++;ST.st++;ST.bs=Math.max(ST.bs,ST.st)}else ST.st=0;
  if(done&&ser){ST.sp++;if(sw===p0)ST.sw++}}
 sv('pg.st',ST);hud();
 if(w&&done&&!S.rm)for(let i=0;i<140;i++)parts.push({x:CX,y:CY-100,vx:(Math.random()-.5)*14,vy:-Math.random()*12,l:3,c:PC[i%6],g:1});
 snd(520,.5,'sine',.2,880);vib(w?[70,40,70]:30);
 const id=G.id;
 setTimeout(()=>{if(!G||G.id!==id||G.st!=='over')return;
  const rows=[...G.pl].sort((a,b)=>a.rank-b.rank||a.i-b.i).map(p=>`<div class="rk" style="--c:${PC[p.i]}"><span class="pos">${w?ord(p.rank):'='}</span><span class="nm">${esc(p.name)}${p.ai?' <small>AI</small>':''}</span><span class="ms">${p.el} out · ${p.ht}/${p.sh} hits</span></div>`).join('');
  const score=ser?`<div class="score">${G.pl.map(p=>`<div style="--c:${PC[p.i]}"><b>${M.scores[p.i]}</b><span>${esc(p.name)}</span></div>`).join('')}</div>`:'';
  const kick=ser?(done?'Series winner':`Round ${M.round} of up to ${M.cfg.series}`):'Match over';
  const title=ser?(done?esc(sw.name)+' wins the series':w?esc(w.name)+' takes the round':'Round drawn'):(w?esc(w.name)+' wins':'Draw');
  const btns=done?`<button class="pr" data-a="rst">Rematch</button><button data-a="menu">Main menu</button>`:`<button class="pr" data-a="next">Next round</button><button data-a="menu">Main menu</button>`;
  show(`<div class="win"><div class="kick">${kick}</div><h2 style="color:${w?PC[(done&&sw?sw:w).i]:'inherit'}">${title}</h2></div>${score}${rows}<div class="g">${btns}</div>`)},S.rm?200:(done?1300:800))}

/* ---------- collisions ---------- */
Events.on(eng,'collisionStart',e=>{for(const pr of e.pairs){const a=pr.bodyA,b=pr.bodyB;
 if(G&&G.st==='sim'&&!G.hit){const cur=G.pl[G.t].body;if((a===cur&&b.label==='pen')||(b===cur&&a.label==='pen')){G.hit=1;G.pl[G.t].ht++}}
 const v=Math.hypot(a.velocity.x-b.velocity.x,a.velocity.y-b.velocity.y);if(v<1)continue;
 snd(180+Math.min(v,20)*18,.08,'triangle',Math.min(.3,v/40));if(S.rm)continue;if(v>8){shake=Math.min(8,v/2.5);vib(18)}
 const c=(pr.collision.supports&&pr.collision.supports[0])||a.position;for(let i=0;i<Math.min(8,v);i++)parts.push({x:c.x,y:c.y,vx:(Math.random()-.5)*4,vy:(Math.random()-.5)*4,l:.5,c:'#ffe9c4'})}});

/* ---------- AI (uses the same flick() as humans) ---------- */
function sched(){clearTimeout(tmr);if(!G||paused||G.st!=='aim'||!G.pl[G.t].ai)return;const id=G.id;tmr=setTimeout(()=>aiPlay(id),S.rm?250:900)}
function aiPlay(id){if(!G||G.id!==id||paused||G.st!=='aim')return;const p=G.pl[G.t];if(!p.ai)return;
 const me=p.body.position,lv=p.ai,foes=G.pl.filter(q=>q!==p&&q.alive),vm=VMAX*S.pw,edge=(x,y)=>Math.min(x-B.x,B.x+B.w-x,y-B.y,B.y+B.h-y);

 for(const q of foes){const t=q.body.position,dx=t.x-me.x,dy=t.y-me.y,d=Math.hypot(dx,dy)||1,ux=dx/d,uy=dy/d;
  let ox=t.x-CX,oy=t.y-CY;const ol=Math.hypot(ox,oy)||1;ox/=ol;oy/=ol;
  const vd=Math.min(vm,Math.max(4,d*G.k*1.2+3+(lv>2?4:1))),ov=Math.max(0,vd/G.k-d)*.25,ang=Math.atan2(dy,dx),sw=sweep(p,ang,d+ov);
  const val=(1-Math.min(edge(t.x,t.y),300)/300)*1.5+(ux*ox+uy*oy)*.8-d/1500-(sw.k==='edge'?3:0)-(sw.k==='obs'?2.5:0);
  if(!best||val>best.val)best={val,vd,ang,q}}
 const pwOf=v=>clamp(Math.pow(Math.max(0,(v-3)/(vm-3)),1/1.3),.1,1);
 let ang,pw;
 if(lv===1){const q=foes[Math.floor(Math.random()*foes.length)],t=q.body.position;ang=Math.atan2(t.y-me.y,t.x-me.x)+gs()*.3;pw=.35+Math.random()*.4}
 else if(lv===2&&(edge(me.x,me.y)<70||Math.random()<.15)){ang=Math.atan2(CY-me.y,CX-me.x)+gs()*.2;pw=.25+Math.random()*.15}
 else{ang=best.ang+gs()*(lv===2?.12:.03);pw=pwOf(best.vd)}
 flick(ang,pw)}

/* ---------- input ---------- */
const cv=$('#c'),cx=cv.getContext('2d');let sc=1,cs=1,rot=false;

function rs(){const r=$('#stage').getBoundingClientRect();rot=r.height>r.width*1.05;const ww=rot?H:W,hh=rot?W:H,s=Math.min(r.width/ww,r.height/hh)||1,d=Math.min(devicePixelRatio||1,2);cv.style.width=ww*s+'px';cv.style.height=hh*s+'px';cv.width=Math.round(ww*s*d);cv.height=Math.round(hh*s*d);sc=s*d;cs=s}
const pt=e=>{const r=cv.getBoundingClientRect(),ux=(e.clientX-r.left)/r.width,uy=(e.clientY-r.top)/r.height;return rot?{x:uy*W,y:H-ux*H}:{x:ux*W,y:uy*H}};
const maxD=()=>Math.min(260,Math.max(MAXD,90/cs)),minD=()=>Math.max(18,14/cs);
const cpOf=(b,t)=>({x:b.position.x+Math.cos(b.angle)*t,y:b.position.y+Math.sin(b.angle)*t});
cv.addEventListener('pointerdown',e=>{if(!G||paused||drag||G.st!=='aim')return;const p=G.pl[G.t];if(p.ai)return;const q=pt(e),b=p.body.position,c=Math.cos(p.body.angle),s=Math.sin(p.body.angle);
 const t=clamp((q.x-b.x)*c+(q.y-b.y)*s,-PL/2,PL/2);if(Math.hypot(q.x-(b.x+c*t),q.y-(b.y+s*t))>Math.min(60,Math.max(26,30/cs)))return;drag={x:q.x,y:q.y,t,id:e.pointerId};try{cv.setPointerCapture(e.pointerId)}catch(err){}e.preventDefault()});

 if(l<minD()){drag=null;return}flick(Math.atan2(vy,vx),Math.min(l,maxD())/maxD(),drag.t)});

addEventListener('resize',rs);

addEventListener('keydown',e=>{if(e.key==='Escape'&&G&&G.st!=='over'){paused?resume():pz()}});

/* ---------- rendering ---------- */
function rr(g,x,y,w,h,r){g.beginPath();g.roundRect(x,y,w,h,r)}
const fallback=(()=>{const c=document.createElement('canvas');c.width=W;c.height=H;const g=c.getContext('2d');g.fillStyle='#0b0b0d';g.fillRect(0,0,W,H);g.fillStyle='#8a5a30';rr(g,B.x,B.y,B.w,B.h,B.r);g.fill();return c})();
function drawPen(g,d,pc){
 const V=h=>{const v=g.createLinearGradient(0,-h,0,h);[[0,'rgba(0,0,0,.6)'],[.1,'rgba(0,0,0,.28)'],[.27,'rgba(255,255,255,.6)'],[.36,'rgba(255,255,255,.22)'],[.55,'rgba(255,255,255,0)'],[.8,'rgba(0,0,0,.3)'],[.94,'rgba(0,0,0,.55)'],[1,'rgba(255,255,255,.14)']].forEach(([o,c])=>v.addColorStop(o,c));return v};
 const M2=h=>{const v=g.createLinearGradient(0,-h,0,h);[[0,'#3a3d42'],[.12,'#d9dde3'],[.25,'#fff'],[.4,'#9aa0a8'],[.58,'#e8ebef'],[.75,'#7b828b'],[.92,'#c3c8ce'],[1,'#30333a']].forEach(([o,c])=>v.addColorStop(o,c));return v};
 const part=(x0,x1,h,base,r=1.2)=>{g.beginPath();g.roundRect(x0,-h,x1-x0,2*h,r);g.save();g.clip();g.fillStyle=base;g.fillRect(x0,-h,x1-x0,2*h);g.fillStyle=V(h);g.fillRect(x0,-h,x1-x0,2*h);g.restore()};

    if(dT<1.3)f*=.5;r*=f;gg*=f;b*=f}
   else if(sd(x,y,0,16)<=0){const u=cl(sT/16),t=vn(x*.01,y*1.2)*.5+vn(x*.04,y*3)*.5;let f=mx(1.05,.55,u)*(.85+.3*t);if(u<.1)f*=1.25;r=104*f;gg=62*f;b=29*f}
   else{const gx=((x%110)+110)%110,gy=((y%110)+110)%110,tl=hs(Math.floor(x/110),Math.floor(y/110)),sh=Math.max(0,1-sd(x,y,5,24)/42)**1.6*.85;
    let v=22+tl*7+(hs(px,row)-.5)*5+vn(x*.03,y*.03)*6;if(gx<1.6||gy<1.6)v*=.55;v*=(.65+.5*Math.exp(-(((x-CX)**2+(y-CY)**2)/490000)))*(1-sh);r=v*1.05;gg=v;b=v*.95}
   D[i]=r;D[i+1]=gg;D[i+2]=b;D[i+3]=255}
  row<h?setTimeout(step,0):fin()};
 step()}

const scr=$('#scr');let cfg=null,tt=0,setupTarget=0,setupPractice=false;

 show(`<div class="logo"><b>Pen<span> Game</span></b><span lang="bn" class="bn">কলম খেলবি?</span><div class="pg"></div><p class="mu">Flick. Knock. Survive.</p></div>
 <div class="g"><button class="pr" data-a="setup">Play · local 2–6 players</button><div class="g2"><button data-a="quick">Quick match</button><button data-a="prac">Practice vs AI</button><button data-a="rules">Rules</button><button data-a="set">Settings</button></div></div>
 <h3>Player 1 stats</h3><div class="st">${cell(ST.p,'Rounds')}${cell(ST.w,'Won')}${cell(pc(ST.w,ST.p),'Win rate')}${cell(ST.e,'Knock-outs')}${cell(pc(ST.ht,ST.sh),'Hit rate')}${cell(ST.p?(ST.rs/ST.p).toFixed(1):'–','Avg rank')}${cell(ST.bs,'Best streak')}${cell(ST.sw+'/'+ST.sp,'Series won')}${cell(fav&&PENS[fav[0]]?esc(PENS[fav[0]].n.split(' ')[0]):'–','Fav pen')}</div>
 <h3>Recent</h3><div class="mu">${ST.rec.length?ST.rec.map(esc).join('<br>'):'No matches yet.'}</div>`)}
function setup(prac){setupPractice=!!prac;setupTarget=0;const s0=ld('pg.cfg',{}),base=[0,1,2,3,4,5].map(i=>prac?{name:i?'AI Rival '+i:'You',ai:i?2:0,pen:i%BUILTIN}:{name:'Player '+(i+1),ai:0,pen:i%BUILTIN});

function rules(){show(`<h2>How to play</h2><h3>Core rules</h3><ol class="steps"><li>Every player gets one pen on the bench.</li><li>Players take turns.</li><li>Grab your pen anywhere along its length and drag backward to aim. Where you hit it decides how it spins.</li><li>Release to flick.</li><li>Hit opponents’ pens toward the edge.</li><li>Keep your own pen on the bench.</li><li>The last pen on the bench wins.</li></ol>

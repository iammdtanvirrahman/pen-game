name: Pen Game validation

on:
  push:
    branches: ["5.0"]
  pull_request:
    branches: ["5.0"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run static smoke tests
        run: node --test tests/smoke.test.mjs
